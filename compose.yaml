name: single-store-team-base
services:
  api:
    build: .
    environment:
      SERVER_PORT: 8080
    ports:
      - "${API_HOST_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
