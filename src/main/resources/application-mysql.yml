spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3309/single_store_team?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Bangkok}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    open-in-view: false

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false

app:
  seed:
    enabled: false